<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Helpdesk Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <h1 class="main-title">Digital Helpdesk Management System</h1>
        <p class="subtitle">Submit and track your support tickets</p>

        <!-- Create Ticket Section -->
        <div class="section-box">
            <h2>Create a Support Ticket</h2>
            <form id="ticketForm">
                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" placeholder="Enter User ID" required>
                </div>
                <div class="form-group">
                    <label for="ticketTitle">Ticket Title</label>
                    <input type="text" id="ticketTitle" placeholder="Enter Ticket Title" required>
                </div>
                <div class="form-group">
                    <label for="problemDescription">Problem Description</label>
                    <textarea id="problemDescription" placeholder="Describe your problem..." required></textarea>
                </div>
                <button type="submit">Submit Ticket</button>
            </form>
        </div>

        <!-- My Tickets Section -->
        <div class="section-box">
            <h2>My Tickets</h2>
            <button type="button" onclick="loadTickets()">View Tickets</button>
            <div id="ticketsContainer" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
